# ================================================================
# MEDHA Persistence Migration Configuration (Alembic)
# ================================================================

[alembic]
# Path to migration environment scripts
script_location = backend/persistence/migrations

# Add current working directory to sys.path
prepend_sys_path = .

# Template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# Max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# Set to 'true' to run the environment during the 'revision' command
# revision_environment = false

# Set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# Search for revision scripts in versions directory
version_locations = %(here)s/backend/persistence/migrations/versions

# Version path separator
version_path_separator = os

# Set to 'true' to search source files recursively in each "version_locations"
# recursive_version_locations = false

# Output encoding
output_encoding = utf-8

# Database URL fallback (overridden at runtime by backend.config.Settings in env.py)
sqlalchemy.url = postgresql+psycopg2://postgres:postgres@localhost:5432/medha_db


[post_write_hooks]
# Post-write hooks for formatting generated migration scripts

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
